# Defina API_ORIGIN no painel do Netlify com a URL publica do Worker Cloudflare.
# No Worker, inclua a URL do Netlify em APP_ORIGINS.
[build]
  command = "npm run build:netlify"
  publish = "dist-netlify"

[build.environment]
  NODE_VERSION = "22"

[context.production.environment]
  NODE_ENV = "production"
